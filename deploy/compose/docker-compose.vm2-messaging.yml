version: "3.9"

services:
  kafka:
    image: apache/kafka:3.7.0
    user: "0:0"
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # --- KRaft mode ---
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listeners ---
      KAFKA_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://192.168.1.30:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Storage directory ---
      KAFKA_LOG_DIRS: /kafka-logs

      # No replication (single-node)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafkadata:/kafka-logs
    networks:
      - messaging-net

  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_VERSION:-2}
    container_name: mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ../mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquittodata:/mosquitto/data
    networks:
      - messaging-net

  door-lock-mock:
    build:
      context: ../../app/services/iot/door-lock-mock
    container_name: door-lock-mock
    depends_on:
      - mosquitto
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
    networks:
      - messaging-net

  badging-mock:
    build:
      context: ../../app/services/iot/badging-mock
    container_name: badge-lock-mock
    depends_on:
      - mosquitto
    networks:
      - messaging-net

  telemetry-backend:
    build:
      context: ../../app/services/telemetry-messaging-backend
    container_name: telemetry-backend
    environment:
      KAFKA_URL: ${KAFKA_URL}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT}
      MQTT_BADGE: ${MQTT_BADGE}
      MQTT_DOOR: ${MQTT_DOOR}
      KAFKA_BADGE: ${KAFKA_BADGE}
      KAFKA_DOOR: ${KAFKA_DOOR}
    depends_on:
      - kafka
      - mosquitto
    networks:
      - messaging-net

volumes:
  kafkadata:
  mosquittodata:

networks:
  messaging-net:
    driver: bridge
