services:
  nginx:
    image: nginx:${NGINX_VERSION:-alpine}
    container_name: badge-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - app-net
    depends_on:
      - core-operational-backend
      - entrance-cockpit-backend
      - cockpit-front

  core-operational-backend:
    build:
      context: ../../app/services/core-operational-backend
    container_name: core-operational-backend
    ports:
      - "8081:8081"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}

      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT}
    networks:
      - app-net

  cache-loader-backend:
    build:
      context: ../../app/services/cache-loader-backend
    container_name: cache-loader-backend
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    networks:
      - app-net

  entrance-cockpit-backend:
    build:
      context: ../../app/services/entrance-cockpit-backend
    container_name: entrance-cockpit-backend
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}

      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT}

      - CORE_BACKEND_URL=${CORE_BACKEND_URL}
      - KAFKA_DOOR_OPENING_TOPIC=${KAFKA_DOOR_OPENING_TOPIC}
    networks:
      - app-net

  cockpit-front:
    build:
      context: ../../app/web/entrance-cockpit-front
    container_name: badge-cockpit-front
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
