services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-15-alpine}
    container_name: badge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: badge-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:${CONFLUENT_VERSION:-7.5.0}
    container_name: badge-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeperdata:/var/lib/zookeeper/data
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION:-7.5.0}
    container_name: badge-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks:
      - backend

  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_VERSION:-2}
    container_name: badge-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ../mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquittodata:/mosquitto/data
      - mosquittolog:/mosquitto/log
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:${NGINX_VERSION:-alpine}
    container_name: badge-nginx
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend
    depends_on:
      - core-operational-backend
      - cockpit-front
      - postgres
      - redis
      - kafka
      - mosquitto
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/healthz | grep ok"]
      interval: 10s
      retries: 5

  core-operational-backend:
    build:
      context: ../../app/services/core-operational-backend
    container_name: core-operational-backend
    ports:
      - "8081:8081"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_started }
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      retries: 5
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092


  cache-loader-backend:
    build:
      context: ../../app/services/cache-loader-backend
    container_name: cache-loader-backend
    depends_on:
      - redis
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_REDIS_HOST=redis
    networks:
      - backend

  entrance-cockpit-backend:
    build:
      context: ../../app/services/entrance-cockpit-backend
    container_name: entrance-cockpit-backend
    depends_on:
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
    - "8088:8082"
    networks:
      - backend

  door-lock-mock:
    build:
      context: ../../app/services/iot/door-lock-mock
    container_name: badge-door-lock-mock
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
    networks:
      - backend

  cockpit-front:
    build:
      context: ../../app/web/entrance-cockpit-front
    container_name: badge-cockpit-front
    depends_on:
      - core-operational-backend
    environment:
      - VITE_LOGS_BACKEND_SSE_URL=/api/events
    networks:
      - backend


volumes:
  pgdata:
  redisdata:
  kafkadata:
  zookeeperdata:
  mosquittodata:
  mosquittolog:

networks:
  backend:
    driver: bridge

