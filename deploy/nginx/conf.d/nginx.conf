upstream core_backend      { server core-operational-backend:8081; }
upstream cockpit_backend   { server entrance-cockpit-backend:8082; }
upstream cockpit_front     { server badge-cockpit-front:80; }

server {
    listen 80;

    location = /healthz {
      return 200 "ok";
    }

    location /assets/ {
      proxy_pass http://cockpit_front;
    }

    location /api/people/ {
      proxy_pass http://core_backend;
    }

    location /api/events {
      proxy_pass http://cockpit_backend;
      proxy_buffering off;
    }

  location /api/manual/ {
    proxy_pass http://cockpit_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }


    location /cockpit/ {
      rewrite ^/cockpit/(.*)$ /$1 break;
      proxy_pass http://cockpit_front;
    }

    location = / {
      return 302 /cockpit/;
    }
}