worker_processes  1;

events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Upstreams use docker service names
  upstream core_backend { server core-operational-backend:8081; }
  upstream cockpit_front { server badge-cockpit-front:80; }

  server {
    listen 80;

    # Health endpoint for compose + manual checks
    location = /healthz {
      default_type text/plain;
      return 200 "ok";
    }

    # API proxy to Spring backend (SSE/WebSocket friendly)
    location /api/ {
      proxy_pass http://core_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "upgrade";
      proxy_set_header Upgrade $http_upgrade;
      proxy_buffering off;
    }

    # Cockpit UI under /cockpit/
    # Strip the /cockpit prefix so the front (served at /) finds its assets.
    location /cockpit/ {
      rewrite ^/cockpit/(.*)$ /$1 break;
      proxy_pass http://cockpit_front;   # no trailing slash
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "upgrade";
      proxy_set_header Upgrade $http_upgrade;
      proxy_buffering off;
    }

    # Optional: redirect root to cockpit UI
    location = / {
      return 302 /cockpit/;
    }
  }
}
