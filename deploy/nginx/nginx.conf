worker_processes  1;

events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Upstreams use docker service names
  upstream core_backend { server core-operational-backend:8081; }
  upstream cockpit_backend { server entrance-cockpit-backend:8082; }
  upstream cockpit_front { server badge-cockpit-front:80; }

  server {
    listen 80;

    # Health endpoint for compose + manual checks
    location = /healthz {
      default_type text/plain;
      return 200 "ok";
    }

    # --- API ROUTING ---

    # Route requests for the CORE backend.
    # The cockpit backend will call this internally (e.g., POST /api/core/manual/open)
    location /api/core/ {
      proxy_pass http://core_backend; # Passes the request as-is.

      # Standard proxy headers
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }



    # Route requests for the COCKPIT backend.
    # The frontend application will call these endpoints.
    location /api/cockpit/ {
      # CRITICAL: This rewrite strips the '/api/cockpit' prefix and replaces it with '/api'.
      # Example: A request for '/api/cockpit/manual/open' becomes '/api/manual/open'
      # before being sent to the cockpit_backend service. This matches its controller paths.
      rewrite ^/api/cockpit/(.*)$ /api/$1 break;

      proxy_pass http://cockpit_backend;

      # Headers required for SSE (Server-Sent Events) and WebSockets to work correctly.
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "upgrade";
      proxy_set_header Upgrade $http_upgrade;
      proxy_buffering off; # Essential for streaming responses
    }



    # --- FRONTEND ROUTING ---

    # Route traffic to the Cockpit UI application.
    # It strips the /cockpit prefix so the React/Vue/etc. app finds its assets at the root.
    location /cockpit/ {
      rewrite ^/cockpit/(.*)$ /$1 break;
      proxy_pass http://cockpit_front;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    

    # Optional: redirect root to cockpit UI
    location = / {
      return 302 /cockpit/;
    }
  }
}
