worker_processes 1;

events { worker_connections 1024; }

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  upstream core_backend      { server core-operational-backend:8081; }
  upstream cockpit_backend   { server entrance-cockpit-backend:8082; }
  upstream cockpit_front     { server cockpit-front:80; }

  server {
    listen 80;

    location = /healthz {
      return 200 "ok";
    }

    # -------------------------------
    # STATIC ASSETS FOR FRONTEND
    # -------------------------------
    location /assets/ {
      proxy_pass http://cockpit_front;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------
    # CORE BACKEND
    # -------------------------------
    location /api/people/ {
      proxy_pass http://core_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------
    # COCKPIT BACKEND SSE
    # -------------------------------
    location /api/events {
      proxy_pass http://cockpit_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_buffering off;
    }

    # -------------------------------
    # COCKPIT BACKEND MANUAL
    # -------------------------------
    location /api/manual/ {
      proxy_pass http://cockpit_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------
    # FRONTEND SPA
    # -------------------------------
    location /cockpit/ {
      rewrite ^/cockpit/(.*)$ /$1 break;
      proxy_pass http://cockpit_front;
      proxy_set_header Host $host;
    }

    # Default redirect
    location = / {
      return 302 /cockpit/;
    }
  }
}
