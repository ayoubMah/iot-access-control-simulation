spring.application.name=entrance-cockpit-backend
server.port=8082

# --- Kafka Consumer ---
spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=cockpit-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=upec.badge.entrance_cockpit_backend.dto

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Topic name
kafka.topic.access-events=${KAFKA_ACCESS_EVENTS_TOPIC:access-events}

# SSE: never time out the async dispatch
spring.mvc.async.request-timeout=-1

# Core backend base URL (used for manual override proxy)
app.core-backend.url=${CORE_BACKEND_URL}
