# Server Port
server.port=8082

# Spring Application Name
spring.application.name=entrance-cockpit-backend

# Kafka Consumer Configuration
spring.kafka.consumer.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=cockpit-group
spring.kafka.consumer.auto-offset-reset=earliest
# Configure Kafka to trust our custom DTO package
spring.kafka.consumer.properties.spring.json.trusted.packages=upec.badge.entrance_cockpit_backend.dto,upec.badge.core_operational_backend.model

# JSON Deserializer for our DTO
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Custom Topic Names
kafka.topic.access-events=access-events

# MQTT Publisher Configuration (for manual control)
mqtt.broker.host=mosquitto
mqtt.broker.port=1883
mqtt.client.id=EntranceCockpitBackend_Manual
mqtt.topic.manual-control=iot/door/manual

# For the SSE endpoint
spring.mvc.async.request-timeout=-1