# Spring Application Name
spring.application.name=cache-loader-backend

# --- CRITICAL ---
# Run as a non-web application. This prevents Tomcat from starting.
spring.main.web-application-type=none

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://192.168.1.20:$5432/badge_db
spring.datasource.username=devuser
spring.datasource.password=devpass
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# --- Redis ---
spring.data.redis.host=192.168.1.30
spring.data.redis.port=6379
spring.cache.type=redis